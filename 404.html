<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#071d35">
  <title>Sayfa Bulunamadı | Emir Tesisat Antalya</title>
  <link rel="icon" href="assets/emir-tesisat-logo.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <style>
    .error-page{min-height:100svh;display:grid;place-items:center;padding:40px 20px;color:#fff;background:#071d35;text-align:center}
    .error-card{width:min(620px,100%)}.error-card img{width:220px;margin:0 auto 38px;filter:brightness(0) invert(1)}
    .error-code{margin:0;color:#7de0dd;font-size:clamp(72px,18vw,130px);font-weight:800;line-height:1}
    .error-card h1{margin:10px 0;font-size:clamp(28px,6vw,42px)}.error-card p{margin:0 auto 28px;color:#ccdae5}
  </style>
</head>
<body>
  <main class="error-page">
    <div class="error-card">
      <img src="assets/emir-tesisat-logo.webp" width="1942" height="809" alt="Emir Tesisat Antalya">
      <p class="error-code" aria-hidden="true">404</p>
      <h1>Aradığınız sayfa bulunamadı.</h1>
      <p>Bağlantı değişmiş veya sayfa kaldırılmış olabilir. Ana sayfaya dönerek hizmetlerimizi inceleyebilirsiniz.</p>
      <a class="button primary" href="/">Ana sayfaya dön</a>
    </div>
  </main>
</body>
</html>
